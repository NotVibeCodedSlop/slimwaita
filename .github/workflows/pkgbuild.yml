name: pkgbuild

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Deps
        run: |
          pacman -Syu --noconfirm --needed git sudo gh
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Clone pkgbuild branch
        run: |
          set -eux
          git clone --depth=1 --single-branch --branch pkgbuild \
            "https://github.com/${GITHUB_REPOSITORY}.git" /build
          chown -R builder:builder /build

      - name: makepkg
        working-directory: /build
        run: |
          set -eux
          sudo -u builder makepkg -s --noconfirm --needed
          ls -la /build/*.pkg.tar.*

      - name: Upload to the triggering release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: /build
        run: |
          set -eux
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            /build/*.pkg.tar.zst
