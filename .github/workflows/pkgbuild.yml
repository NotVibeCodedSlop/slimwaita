name: pkgbuild

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to attach package to'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies & setup builder
        run: |
          pacman -Syu --noconfirm --needed git sudo github-cli
          useradd -m -G wheel builder
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel
          git config --system --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix workspace permissions
        run: chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Build package
        run: |
          sudo -u builder makepkg -s --noconfirm --needed
          ls -la *.pkg.tar.*

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_TAG="${{ inputs.tag }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="${GITHUB_REF_NAME}"
          fi

          echo "Uploading to release: ${TARGET_TAG}"
          gh release upload "${TARGET_TAG}" *.pkg.tar.zst \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Recreate release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_TAG="${{ inputs.tag }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="${GITHUB_REF_NAME}"
          fi

          BRANCH_NAME="${TARGET_TAG}"
          echo "Recreating branch: ${BRANCH_NAME} at SHA ${GITHUB_SHA}"

          # Delete existing branch if it exists (ignore failure if it doesn't exist yet)
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_NAME}" || true

          # Create the branch anew pointing to the current commit
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BRANCH_NAME}" \
            -f sha="${GITHUB_SHA}"
