name: pkgbuild

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to attach package to'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies & setup builder
        run: |
          pacman -Syu --noconfirm --needed git sudo github-cli
          useradd -m -G wheel builder
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel

      - name: Checkout pkgbuild
        uses: actions/checkout@v4
        with:
          ref: pkgbuild
          path: build

      - name: Fix permissions
        run: chown -R builder:builder "${GITHUB_WORKSPACE}/build"

      - name: Build package
        working-directory: build
        run: |
          sudo -u builder makepkg -s --noconfirm --needed
          ls -la *.pkg.tar.*

      - name: Determine Release Tag & Upload
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: build
        run: |
          TARGET_TAG="${{ inputs.tag }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="${GITHUB_REF_NAME}"
          fi

          echo "Uploading to release: ${TARGET_TAG}"
          gh release upload "${TARGET_TAG}" *.pkg.tar.zst --clobber
